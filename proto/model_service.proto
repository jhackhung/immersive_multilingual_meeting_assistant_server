// 檔案: model_service.proto
syntax = "proto3";

option csharp_namespace = "IMMA.Grpc";

package model.v1;

// 我們可以將服務名稱改得更貼切，例如 TranslatorService
service TranslatorService {
  // 定義一個名為 Translate 的 RPC (遠端程序呼叫)
  // 它接收 TranslateRequest，並回傳 TranslateResponse
  rpc Translate (TranslateRequest) returns (TranslateResponse) {}
}

service MediaService {
  // 1. Wav2Lip: 根據音訊和圖片產生對嘴影片
  rpc Wav2Lip(Wav2LipRequest) returns (Wav2LipResponse) {}

  // 2. TTS (Text-to-Speech): 將文字轉換為語音
  rpc Tts(TtsRequest) returns (TtsResponse) {}

  // 3. SpeakerAnnote (Speaker Annotation/Diarization): 說話者日誌
  rpc SpeakerAnnote(SpeakerAnnoteRequest) returns (SpeakerAnnoteResponse) {}

  // 4. SpeechRecognition (Speech-to-Text): 語音識別
  rpc SpeechRecognition(SpeechRecognitionRequest) returns (SpeechRecognitionResponse) {}

  // LLM 服務
  rpc GenerateText(TextGenerationRequest) returns (TextGenerationResponse);
  rpc ChatCompletion(ChatCompletionRequest) returns (ChatCompletionResponse);

  // 新增的 RAG 問答 RPC
  rpc AnswerQuestionFromDocuments(AnswerQuestionRequest) returns (AnswerQuestionResponse);

  // 虛擬頭像相關 RPC
  rpc InitAvatar(InitAvatarRequest) returns (InitAvatarResponse);
  rpc AvatarSpeak(AvatarSpeakRequest) returns (AvatarSpeakResponse);

  // STT service
  rpc StreamingRecognize (stream StreamingRecognizeRequest) returns (stream StreamingRecognizeResponse);
}

// 定義請求的資料結構
message TranslateRequest {
  string text_to_translate = 1;
  string source_language = 2;
  string target_language = 3;
}

// 定義回應的資料結構
message TranslateResponse {
  string translated_text = 1;
}

// Wav2Lip 請求
message Wav2LipRequest {
  // 音訊檔案的原始 bytes 資料
  bytes audio_data = 1;
  // 圖片檔案的原始 bytes 資料
  bytes image_data = 2;
}

// Wav2Lip 回應
message Wav2LipResponse {
  // 生成的影片檔案的原始 bytes 資料
  bytes video_data = 1;
}

// TTS 請求
message TtsRequest {
  // 需要轉換為語音的文字內容
  string text_to_speak = 1;
  // (可選) 用於聲音複製的參考音訊 bytes
  bytes reference_audio = 2;
  string language = 3;
}

// TTS 回應
message TtsResponse {
  // 生成的音訊檔案的原始 bytes 資料
  bytes generated_audio = 1;
}

// SpeakerAnnote 請求
message SpeakerAnnoteRequest {
  // 音訊檔案的原始 bytes 資料
  bytes audio_data = 1;
}

message DiarizationSegment {
  // 說話者的標籤 (例如 "SPEAKER_00", "SPEAKER_01")
  string speaker = 1;
  // 此片段在音訊中的開始時間 (單位：秒)
  double start_time = 2; // 使用 double 提高精度，對應 turn.start
  // 此片段在音訊中的結束時間 (單位：秒)
  double end_time = 3;   // 對應 turn.end
}

message SpeakerTimeline {
  // 說話者的標籤
  string speaker = 1;
  // 'repeated' 表示這是一個列表，包含該說話者的所有片段
  repeated DiarizationSegment segments = 2;
}

// SpeakerAnnote 的回應，同時包含兩種實用的格式
message SpeakerAnnoteResponse {
  // 格式一：扁平化的片段列表，直接對應 process_audio 的回傳
  repeated DiarizationSegment all_segments = 1;

  // 格式二：按說話者分組的時間軸，對應 get_speaker_timeline 的回傳
  repeated SpeakerTimeline speaker_timelines = 2;
}

// SpeechRecognition 請求
message SpeechRecognitionRequest {
  // 音訊檔案的原始 bytes 資料
  bytes audio_data = 1;
  // 語言代碼 (可選, 例如 "en", "zh", "auto" 表示自動檢測)
  string language = 2;
  // 是否返回時間戳訊息
  bool return_timestamps = 3;
  // 模型大小 (可選, 例如 "base", "small", "medium", "large")
  string model_size = 4;
}

// 語音識別片段 (包含時間戳)
message TranscriptionSegment {
  // 片段文本
  string text = 1;
  // 開始時間 (秒)
  double start_time = 2;
  // 結束時間 (秒)
  double end_time = 3;
}

// SpeechRecognition 回應
message SpeechRecognitionResponse {
  // 完整轉錄文本
  string transcribed_text = 1;
  // 檢測到的語言
  string detected_language = 2;
  // 語言檢測置信度
  float language_confidence = 3;
  // 時間戳片段 (如果請求時啟用)
  repeated TranscriptionSegment segments = 4;
  // 處理是否成功
  bool success = 5;
}

// 文本生成請求
message TextGenerationRequest {
    string prompt = 1;
    int32 max_tokens = 2;
    float temperature = 3;
    float top_p = 4;
}

// 文本生成回應
message TextGenerationResponse {
    string generated_text = 1;
    bool success = 2;
    string error_message = 3; // Added
}

// 聊天訊息
message ChatMessage {
    string role = 1;  // "system", "user", "assistant"
    string content = 2;
}

// 對話完成請求
message ChatCompletionRequest {
    repeated ChatMessage messages = 1;
    int32 max_tokens = 2;
    float temperature = 3;
}

// 對話完成回應
message ChatCompletionResponse {
    string response = 1;
    bool success = 2;
    string error_message = 3; // Added
}

// --- 新增的 RAG 問答訊息 ---

// RAG 問答請求
message AnswerQuestionRequest {
    string query = 1; // 使用者的問題
}

// RAG 問答回應
message AnswerQuestionResponse {
    string answer = 1;       // 模型生成的回應
    repeated string sources = 2; // 答案參考的文件來源
    bool success = 3;        // 是否成功
    string error_message = 4; // Added
}

// 音訊資料塊
message AudioChunk {
  bytes audio_bytes = 1;
}

// 詞級資訊
message WordInfo {
  // 詞彙本身。
  string word = 1;
  // 詞彙的開始時間（秒）。
  float start_time_sec = 2;
  // 詞彙的結束時間（秒）。
  float end_time_sec = 3;
  // 辨識的置信度。
  float confidence = 4;
}

// 句子或片段資訊
message Segment {
  // 辨識出的文字。
  string text = 1;
  // 片段的開始時間（秒）。
  float start_time_sec = 2;
  // 片段的結束時間（秒）。
  float end_time_sec = 3;
  // 詞級資訊。
  repeated WordInfo words = 4;
  // 說話人 ID，如果未知則為 "unknown"。
  string speaker_id = 5;
}

// 客戶端發送的請求訊息
message StreamingRecognizeRequest {
  AudioChunk audio = 1;

  string language = 2;

  // 標記音訊串流的結束。
  bool is_last = 3;
}

// 伺服器回傳的回應訊息
message StreamingRecognizeResponse {
  string session_id = 1;
  
  string transcript_text = 2;
  
  // 標記結果（final）。
  bool is_final = 3;
  
  // 結構化的片段與詞級資訊。
  repeated Segment segments = 4;
  
  // 錯誤或提示訊息。
  string message = 5;
  
  // 實時因子（Real-time factor），處理時間 / 音訊時長。
  double rtf = 6;
  
  // 伺服器已處理的音訊總時長（秒）。
  double chunk_sec = 7;

  // 伺服器端處理此次請求的時間（秒）。
  double server_time_sec = 8;
}

// --- 虛擬頭像相關訊息 ---

// 初始化頭像請求
message InitAvatarRequest {
    bytes image_data = 1;        // 頭像圖片數據
    bytes sample_audio_data = 2; // 樣本音頻數據
}

// 初始化頭像回應
message InitAvatarResponse {
    bool success = 1;   // 是否成功
    string message = 2; // 回應訊息
}

// 頭像說話請求
message AvatarSpeakRequest {
    string text = 1;     // 要說的文字
    string language = 2; // 語言代碼 (可選，默認 "en")
}

// 頭像說話回應
message AvatarSpeakResponse {
    bool success = 1;   // 是否成功
    string message = 2; // 回應訊息
}